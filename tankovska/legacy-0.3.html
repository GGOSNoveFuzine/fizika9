<div class="modalhead"><h2 id="modalTitle">Kako osvojiti areno</h2><button data-action="close" aria-label="Zapri pravila">Zapri ×</button></div>
<ol>
<li><strong>Izberi orožje.</strong> Klikni izstrelek in izberi maso. Dvojna masa pomeni dvojno ceno izstrelka. Pri 40 kg: krogla 2.000 €, stožec 6.000 €, volfram 10.000 €. Letalski spust ima stalni strošek poleta 20.000 €. Energija se prišteje: 1 kJ = 1.000 €.</li>
<li><strong>Usmeri top.</strong> ← / → spreminjata naklon, ↑ / ↓ silo. Meriš lahko tudi z miško. Sprememba sile ohrani kot. Največjo silo omejuje denar.</li>
<li><strong>Označi cilj letalu.</strong> ← / → ali miška izberejo cilj na tleh; ↑ / ↓ ali navpični drsnik na levi višino, gumbi pa maso tovora. Višina in cena dviga se merita od skupne ravni 0 m na merilu bojišča. Gor pomeni višji spust, dol nižjega. Letalo samo izbere mesto spusta. Višji let stane več. Daljši padec do terena pomeni večji raztros. Težji tovor povzroči več škode in večji krater, dokler ni dosežena omejitev kraterja. Najnižjo višino določa varen prelet nad najvišjim delom terena; največja višina je 87 m.</li>
<li><strong>Napadi s presledkom.</strong> Pred napadom lahko rešiš račun. Pravilno: 75 % možnosti za napad ×1,5. Napačno: 25 % za ×0,5. Preskok: običajen napad. Računski množitelj velja tudi proti ščitu. Pot in cena strela ostaneta enaki.</li>
<li><strong>Volfram: ×1,5 HP škode.</strong> Ščit najprej absorbira napad. Ko se izprazni, presežek istega zadetka že povzroči povečano HP škodo.</li>
<li><strong>Obramba.</strong> Ob opozorilu lahko rešiš račun za ×1,5 daljši umik za isto ceno. Nato z ← / → ali drsnikom izberi razdaljo in potrdi. Ostani je brezplačno. Teren in denar omejujeta premik. Napad čaka na tvojo odločitev.</li>
<li><strong>Varčuj ali obnovi ščit.</strong> Začneš s 60.000 €. Vsaka naslednja lastna poteza doda do 15.000 €. Varčevanje doda do 10.000 € in zaključi potezo. Osnovna denarnica ima največ 150.000 €. Obnova kupi do 16 kJ ščita: 1.000 €/kJ + 1.000 €.</li>
<li><strong>Moje sledi.</strong> Sledi vseh tvojih prejšnjih topovskih strelov v tem boju so privzeto vključene. Velik gumb pod bojiščem jih skrije ali pokaže. S kazalcem poudari sled in preberi maso, silo in kot. Za trajno izbiro ali prekrivajoče se sledi odpri Seznam mojih strelov; Esc izbiro sprosti. Miška na bojišču še naprej meri. Nasprotnikovih strelov in letalskih spustov ni v pregledu.</li>
<li><strong>Tri stopnje.</strong> Planota kaže celotno pot, Greben njen začetek, Kotlina pa nima predogleda. Namigi pri nalogah so na voljo na 1. in 2. stopnji. Po zmagi izbereš nadgradnjo in nadaljuješ.</li>
</ol>
<details><summary>Cene izstrelkov</summary>
<table class="weapon-price-table"><caption>Cena izstrelka brez energije</caption><thead><tr><th scope="col">Izstrelek</th><th scope="col">20 kg</th><th scope="col">40 kg</th><th scope="col">80 kg</th></tr></thead><tbody><tr><th scope="row">Krogla</th><td>1.000 €</td><td>2.000 €</td><td>4.000 €</td></tr><tr><th scope="row">Stožec</th><td>3.000 €</td><td>6.000 €</td><td>12.000 €</td></tr><tr><th scope="row">Volfram</th><td>5.000 €</td><td>10.000 €</td><td>20.000 €</td></tr></tbody></table>
<p>Energija se prišteje: 1.000 € za 1 kJ. Letalo: 20.000 € za polet + energija dviga in vodoravne hitrosti tovora.</p></details>
<details><summary>Fizika in škoda</summary>
<p><strong>A = F · s, Wₖ = m · v² / 2, Wₚ = m · g · h, P = A / t.</strong> Uporabljamo g = 10 m/s². Delo in energijo merimo v J, moč v W. Top opravlja delo na poti 2 m. Veter in zračni upor sta zanemarjena.</p>
<p>Pri isti energiji je težji izstrelek počasnejši. Pri enakih začetnih in končnih višinah visok lok ne poveča hitrosti zadetka. Izstrelek lahko poleti nad zaslon in nato pade nazaj. Kazalnik ob zgornjem robu kaže njegov položaj ter ali se dviga ali pada. Let se konča ob prvem trku ali izhodu prek levega oziroma desnega roba celotnega polja. Lasten strel, bližnji udarec in padec v krater lahko poškodujejo tudi tvoj tank; pri zadetku najprej ščiti tvoj ščit.</p>
<p>Tovor ob spustu ohrani vodoravno hitrost letala 12 m/s in začne padati z navpično hitrostjo 0. Plačaš dvig m · g · h od skupne ničelne ravni bojišča in vodoravno kinetično energijo m · v² / 2. Pri isti masi in višini leta je cena povsod enaka. Dejanska višina padca je razlika med višino leta in višino mesta trka: Wₖ ob trku = m · v² / 2 + m · g · (h leta − h trka). Nad višjim terenom je padec krajši in energija zadetka manjša. Začetno mesto spusta ima naključen odmik; tovor nato leti po paraboli brez popravljanja smeri. Letalski napad ima 40 % običajnega HP učinka in samo 10 % učinka proti ščitu. Če ščit zdrži, neposredne HP škode ni. Ob preboju učinkuje na HP le neabsorbirani delež napada. Večja masa pri enaki višini ne skrajša časa padanja.</p>
<p>Hitrost ob trku določi Wₖ. Računski množitelj poveča ali zmanjša igralni učinek napada pred ščitom. Po ščitu se preostanek razdeli: 79,2 % za neposredno HP škodo, 10,8 % za teren in 10 % za bližnje učinke. Pri trku v teren gre 90 % terenu in 10 % okolici.</p>
<p>Neposredna HP škoda = učinek za telo / 450 J × faktor izstrelka × natančnost zadetka. Krogla: ×1; stožec: ×1,2; volfram: ×1,5. Osrednji zadetek je močnejši od robnega. Faktor izstrelka ne poveča učinka proti ščitu. Letalski tovor ima dodatni faktor HP ×0,4, proti ščitu ×0,1; fizikalna energija ostane nespremenjena.</p>
<p>Območje bližnje škode sega do 8 m od mesta udarca. Škoda pojema z razdaljo do tanka, upošteva teren in ščit ter ne preseže 6 HP na tank; pri letalskem tovoru največ 2,4 HP. Neposreden zadetek je bistveno močnejši. Krater lahko povzroči padec. Škoda padca se računa ločeno iz lastne potencialne energije tanka.</p>
<p>Motor 4 kW v 2 s opravi do 8 kJ dela: do 6 m za 8.000 €. S pravilnim računom: do 9 m za 8.000 €. Tudi krajši umik je sorazmerno cenejši. Tank ne vozi navkreber.</p>
</details>
<details><summary>Vprašanja in napredek</summary>
<p>Reši račun v navedeni enoti; dovoljena sta decimalna vejica in pika. Uporabljaš lahko kalkulator. Imaš en poskus brez časovne omejitve. Namig je na voljo na prvih dveh stopnjah. Po odgovoru se pokaže PRAVILNO ali NEPRAVILNO ter pravilen odgovor s formulo in celotnim postopkom. Boj počaka na Nadaljuj. Rešitev lahko pozneje ponovno odpreš v Dogodkih.</p>
<p>Vprašanja se z vsako stopnjo otežujejo. Statistika loči pravilne odgovore, samostojne rešitve in namige. Napredek se shrani v tem brskalniku, če je shranjevanje omogočeno.</p>
</details>
</template>

 openModal(`<div class="modalhead"><span class="eyebrow">Stopnja ${s.stageId}/3 · ${J.STAGES[s.stageId].name}</span><button data-action="menu">Meni</button></div><h2 id="modalTitle" class="end-title">${win?(s.stageId===3?'Osvojil si vse tri arene!':'Arena je tvoja.'):'Tokrat je zmanjkalo joulov.'}</h2><p>${win?'Premagal si oba nasprotnika. Izberi eno nadgradnjo za naslednje boje.':'Spremeni jakost napada, predvidi izmik ali pravočasno obnovi ščit.'}</p><p>${escape(s.playerName||s.tanks[0].name)}</p><div class="end-score">${game.score()} <small>točk boja</small></div><div class="end-stats"><div><b>${s.stats.correct} / ${s.stats.attempts}</b><small>Pravilni računi / poskusi</small></div><div><b>${s.stats.independent}</b><small>Pravilno brez namiga</small></div><div><b>${s.stats.hints}</b><small>Uporabljeni namigi</small></div><div><b>${s.turn}</b><small>Skupaj potez</small></div></div>${win?`<div class="upgrade-grid">${[['wallet','Večja denarnica','+20.000 € največjega dobroimetja'],['power','Močnejši motor','+1 kW za prihodnje izmike'],['shield','Večji ščit','+10 kJ največje kapacitete']].map(([key,title,detail])=>`<button data-action="upgrade" data-value="${key}" ${picked?'disabled':''} class="${picked===key?'active':''}">${picked===key?'✓ ':''}${title}<small>${detail}</small></button>`).join('')}</div>`:''}<div class="dialogbottom"><button data-action="replay">Ponovi isti boj</button><button class="primary" data-action="continue">${win?(s.stageId===3?'Nova kampanja →':'Naslednja stopnja →'):'Ponovi stopnjo →'}</button></div>`,'end');cue(win?'win':'lose','end');
}
function statistics(){const d=store.data;openModal(`<div class="modalhead"><h2 id="modalTitle">Tvoj napredek</h2><button data-action="close">Zapri ×</button></div><div class="end-stats"><div><b>${d.wins}/${d.battles}</b><small>Zmage / končani boji</small></div><div><b>${d.best}</b><small>Najboljši rezultat</small></div><div><b>${d.totals.correct}/${d.totals.attempts}</b><small>Pravilni računi / poskusi</small></div><div><b>${d.totals.independent}</b><small>Pravilno brez namiga</small></div></div><p>Namigi: ${d.totals.hints}. Preskočeni računi: ${d.totals.skipped}. Trenutni boj se prišteje, ko ga zaključiš. Če shranjevanje v brskalniku ni omogočeno, napredek po zaprtju ni ohranjen.</p><p>Nadgradnje: denarnica +${J.money(d.upgrades.wallet*20)}; motor +${d.upgrades.power} kW; kapaciteta ščita +${d.upgrades.shield*10} kJ.</p><div class="dialogbottom"><button class="ghost" data-action="reset-question">Izbriši ves napredek …</button></div>`,'stats');}
function goMenu(){delete document.body.dataset.guideStep;audio.pause();clearTimeout(timer);running=false;menu=true;modalType='';$('modalOverlay').hidden=true;$('modal').innerHTML='';blockBackground(false);persist();render();}
function rockHeightMin(x){return P.airLimits(game.state.terrain,x,game.state.worldHeight).min;}
function rockHeightMax(x){return P.airLimits(game.state.terrain,x,game.state.worldHeight).max;}
function fitRock(patch){const d=game.state.draft;if((patch.weapon??d.weapon)!=='rock')return patch;const x=patch.targetX??d.targetX;return {...patch,height:J.clamp(patch.height??d.height,rockHeightMin(x),rockHeightMax(x))};}
function configure(patch){const before=game.state.draft.force,ok=apply({type:'configure',actor:0,patch:fitRock(patch)});if(ok&&(patch.projectile||patch.mass||patch.weapon==='shell')&&game.state.draft.force<before)toast('Sila prilagojena denarju: '+J.num(game.state.draft.force/1000)+' kN.');return ok;}
function action(name,el){
 const value=el?.dataset?.value,s=game.state,actor=s.phase===F.DEFEND?game.defender?.id:s.active;
 if(name==='scorm-retry'){J.SCORM?.retry();scormStatus();return;}
 if(name==='scorm-exit'){persist();if(J.SCORM.mode==='normal'&&!J.SCORM.flush()){scormStatus();return;}clearTimeout(timer);running=false;audio.pause();J.SCORM.finish();$('gameApp').hidden=true;$('scormMessage').textContent=J.SCORM.mode!=='normal'?'Pregled je zaključen. Rezultat v učilnici ni bil spremenjen.':J.SCORM.passed?'Domača naloga je opravljena in shranjena. Lahko zapreš dejavnost.':'Napredek je shranjen. Lahko zapreš dejavnost in pozneje nadaljuješ.';$('scormExit').disabled=true;$('scormRetry').hidden=true;return;}

 if(modalType==='feedback'&&!['feedback-continue','menu'].includes(name))return;
 if(modalType==='tutorial'&&!['guide-next','guide-prev','guide-skip','menu'].includes(name))return;
 if(modalType==='defense-offer'&&!['defense-bonus','defense-no-bonus','menu'].includes(name))return;
 if(modalType.startsWith('bonus-')&&!['close','bonus-hint','bonus-skip','answer-sign'].includes(name))return;
 if(modalType==='defense'&&!['dodge-step','dodge-zero','dodge','stay','defense-bonus','menu'].includes(name))return;
 if(modalType&&!modalType.startsWith('bonus-')&&modalType!=='defense'&&['lock','shield','save','next','dodge','weapon','direction','select-weapon','mass-choice','close-weapon'].includes(name))return;
 if(name==='feedback-continue'){if(apply({type:'continue-feedback',actor:0})){closeModal(false);after();}}
 else if(name==='traces-toggle'){endDrag();options.showTraces=!options.showTraces;options.traceHover=null;options.tracePinned=null;renderer.hasFrame=false;render();}
 else if(name==='trace-list')traceList();
 else if(name==='trace-pick'){if(ownTraces().some(t=>t.id===value)){options.tracePinned=value;options.showTraces=true;renderer.hasFrame=false;closeModal();}}
 else if(name==='guide-open')showGuide(0,'manual');
 else if(name==='guide-next'){const p=store.data.guide.pending;if(p.step<(p.kind==='manual'?J.Tutorial.steps.length-1:p.kind==='intro'?2:p.step))showGuide(p.step+1,p.kind);else finishGuide();}
 else if(name==='guide-prev'){const p=store.data.guide.pending;if(p.step>0&&['intro','manual'].includes(p.kind))showGuide(p.step-1,p.kind);}
 else if(name==='guide-skip')finishGuide();
 else if(name==='setup')setup();
 else if(name==='start')start('challenge');
 else if(name==='load-questions')$('questionFile').click();
 else if(name==='resume'){if(J.SCORM&&(!J.SCORM.connected||J.SCORM.finished)){toast(J.SCORM.message);return;}if(!J.Bank.ready){toast(J.Bank.error||'Najprej naloži vprašanja.');return;}menu=false;running=true;phaseKey='';const guide=store.data.guide.pending;after();if(s.feedback)return;if(guide&&guide.battleId===game.state.id&&!store.data.guide.disabled){showGuide(guide.step,guide.kind);return;}if(game.bonusForPhase()?.q?.status==='pending'&&((s.phase===F.PREP&&s.active===0)||(s.phase===F.DEFEND&&game.defender?.id===0)))openBonus(s.phase===F.DEFEND);}
 else if(name==='menu')goMenu();
 else if(name==='close'){if(modalType==='bonus-defense')game.state.defenseBonus.offerAccepted=false;closeModal();}
 else if(name==='sound'){options.sound=!options.sound;audio.setEnabled(options.sound);persist();render();}
 else if(name==='effects'){options.reduced=!options.reduced;persist();render();}
 else if(name==='overview'){options.overview=!options.overview;render();}
 else if(name==='hitboxes'){options.hitboxes=!options.hitboxes;render();}
 else if(name==='help'){const b=game.bonusForPhase();if(game.canHint()&&b?.q?.status==='pending'&&actor===0){game.dispatch({type:'hint',actor});persist();render();}openModal($('helpTemplate').innerHTML,'help');}
 else if(name==='answer-sign'){const e=$('bonusAnswer');if(e){e.value=e.value.startsWith('-')?e.value.slice(1):'-'+e.value;e.focus();}}
 else if(name==='select-weapon'&&s.phase===F.PREP&&s.active===0){const current=s.draft.weapon==='rock'?'rock':s.draft.projectile;settingsOpen=value!==current||!settingsOpen;configure(value==='rock'?{weapon:'rock'}:{weapon:'shell',projectile:value});if(settingsOpen)$('weaponPopover')?.querySelector('button[data-action="mass-choice"]')?.focus({preventScroll:true});if(['rock','rod'].includes(value)&&!store.data.guide.disabled&&!store.data.guide[(value==='rock'?'air':value)+'Seen'])showGuide(value==='rock'?4:5,value);}
 else if(name==='close-weapon'){settingsOpen=false;render();$('arena')?.focus({preventScroll:true});}
 else if(name==='mass-choice'&&s.phase===F.PREP&&s.active===0){settingsOpen=s.draft.weapon==='rock';configure({[s.draft.weapon==='rock'?'rockMass':'mass']:Number(value)});$('arena')?.focus({preventScroll:true});}
 else if(name==='weapon')configure({weapon:value});
 else if(name==='direction')configure({direction:Number(value)});
 else if(name==='defense-bonus'&&s.phase===F.DEFEND&&game.defender?.id===0&&game.canQuestion()&&!s.defenseBonus.used){s.defenseBonus.offerAccepted=true;openBonus(true);}
 else if(name==='defense-no-bonus'&&s.phase===F.DEFEND&&game.defender?.id===0){s.defenseBonus.offerAccepted=true;apply({type:'skip',actor:0});}
 else if(name==='bonus-hint'){const defense=modalType==='bonus-defense';const value=$('bonusAnswer')?.value,unit=$('modal').querySelector('select')?.value;if(apply({type:'hint',actor:0})){bonusDialog(defense);if($('bonusAnswer'))$('bonusAnswer').value=value||'';if(unit)$('modal').querySelector('select').value=unit;}}
 else if(name==='bonus-skip')finishBonus(true);
 else if(name==='details')details();
 else if(name==='dodge-step')setDodge(dodge+Number(value)*.5);
 else if(name==='dodge-zero')setDodge(0);
 else if(name==='stay')apply({type:'dodge',actor:0,distance:0});
 else if(name==='lock')requestFire();
 else if(['shield','save'].includes(name)&&s.phase===F.PREP&&s.active===0)apply({type:name,actor:0});
 else if(name==='dodge')apply({type:'dodge',actor:0,distance:dodge});
 else if(name==='statistics')statistics();
 else if(name==='upgrade'){
  if(s.phase!==F.END||s.tanks[0].hp<=0)return;
  store.data.upgradeChoices=store.data.upgradeChoices||{};if(store.data.upgradeChoices[s.id])return;
  if(!['wallet','power','shield'].includes(value))return;
  store.data.upgrades[value]++;store.data.upgradeChoices[s.id]=value;store.save();modalType='';showEnd();
 }
 else if(name==='replay')start(s.mode,{playerName:s.playerName,topics:s.topics,questionDifficulty:s.questionDifficulty,seed:s.seed,stageId:s.stageId,battleNumber:s.battleNumber+1});
 else if(name==='continue'){const won=s.tanks[0].hp>0,stageId=won?(s.stageId===3?1:s.stageId+1):s.stageId;start(won?J.STAGES[stageId].mode:s.mode,{playerName:s.playerName,topics:s.topics,questionDifficulty:s.questionDifficulty,seed:s.seed.split('-boj-')[0]+'-boj-'+(s.battleNumber+1),stageId,battleNumber:s.battleNumber+1});}
 else if(name==='reset-question')openModal('<div class="modalhead"><h2 id="modalTitle">Res izbrišem ves napredek?</h2></div><p>Izbrisani bodo shranjeni boj, najboljši rezultat, statistika in nadgradnje. Tega ni mogoče razveljaviti.</p><div class="dialogbottom"><button data-action="statistics">Obdrži napredek</button><button data-action="reset-confirm">Da, izbriši</button></div>','reset');
 else if(name==='reset-confirm'){clearTimeout(timer);store.reset();hasBattle=false;game=new J.Game();goMenu();toast('Napredek je izbrisan.');}
}
document.addEventListener('click',event=>{audio.unlock();const el=event.target.closest?.('[data-action]');if(el&&!el.disabled){try{action(el.dataset.action,el);}catch(e){toast(e.message);}}});
document.addEventListener('submit',event=>{
 if(event.target.id!=='answerForm')return;event.preventDefault();if(!modalType.startsWith('bonus-')||game.bonusForPhase()?.q?.status!=='pending')return;
 const form=event.target,answer={text:form.elements.answer.value,unit:form.elements.unit.value},checked=J.Questions.check(game.bonusForPhase().q,answer.text,answer.unit);
 if(!checked.valid){$('answerError').hidden=false;$('answerError').textContent=checked.reason;$('bonusAnswer').setAttribute('aria-invalid','true');$('bonusAnswer').focus({preventScroll:true});return;}finishBonus(false,answer);
});
document.addEventListener('input',event=>{
 if(modalType&&modalType!=='defense')return;const f=event.target.dataset?.field;if(!f)return;const output=$('out-'+f);
 if(output){const units={force:'N',height:'m',angle:'°',dodge:'m'};output.textContent=f==='targetX'?'← →':J.num(Number(event.target.value))+' '+(units[f]||'');}
 if(event.target.type==='range')updateLiveControl(f,Number(event.target.value));
});
document.addEventListener('change',event=>{if(event.target.id==='questionFile'){loadBankFile(event.target.files?.[0]);return;}if(event.target.id==='guideHide'){store.data.guide.disabled=event.target.checked;persist();return;}if(modalType&&modalType!=='defense')return;const f=event.target.dataset?.field;if(!f||f==='force'||f==='stroke')return;if(f==='dodge')setDodge(Number(event.target.value));else configure({[f]:f==='projectile'?event.target.value:Number(event.target.value)});});
let drag=null;
function endDrag(){
 if(!drag)return;const id=drag.id;drag=null;renderer.dragging=false;
 try{if($('arena').hasPointerCapture?.(id))$('arena').releasePointerCapture(id);}catch(e){}
}
function pointerAim(event){
 if(!drag||event.pointerId!==drag.id)return;
 const p=renderer.world(event.clientX,event.clientY),d=game.state.draft,a=game.active;let patch;
 if(d.weapon==='rock')patch={targetX:J.clamp(p.x,2,P.width(game.state.terrain)-2)};
 else if(drag.kind==='path'){
  const target={x:p.x+drag.offset.x,y:p.y+drag.offset.y};
  patch=P.aimAt(a,target,P.speed(game.baseCost(),d.mass),d.angle);
  if(!patch){$('stageMessage').textContent='Ta točka pri izbrani energiji ni dosegljiva. Pot ostaja pri zadnji veljavni smeri.';return;}
 }else patch={angle:J.clamp(Math.atan2(p.y-a.y-C.barrelPivotY,Math.abs(p.x-a.x-C.barrelPivotX))*180/Math.PI,C.angleMin,C.angleMax),direction:p.x<a.x+C.barrelPivotX?-1:1};
 if(configure(patch))$('stageMessage').textContent='Merjenje z miško · cena in energija ostajata enaki.';
}
$('arena').addEventListener('pointerdown',event=>{
 if(menu||modalType||game.state.phase!==F.PREP||game.state.active!==0||event.isPrimary===false||event.button>0)return;
 audio.unlock();event.preventDefault();options.tracePinned=null;options.traceHover=null;paintTraceInfo();if(settingsOpen&&game.state.draft.weapon!=='rock'){settingsOpen=false;renderAttack();}const p=renderer.world(event.clientX,event.clientY),seconds=J.previewSeconds(game.state.stageId),points=renderer.preview?renderer.previewPoints(renderer.preview,seconds):[];
 let nearest=null,best=24/renderer.scale;
 for(const point of points){const distance=Math.hypot(p.x-point.x,p.y-point.y);if(distance<best){best=distance;nearest=point;}}
 drag={id:event.pointerId,kind:nearest?'path':'angle',offset:nearest?{x:nearest.x-p.x,y:nearest.y-p.y}:{x:0,y:0}};renderer.dragging=true;
 $('arena').setPointerCapture?.(event.pointerId);if(!nearest||game.state.draft.weapon==='rock')pointerAim(event);
});
$('arena').addEventListener('pointerleave',()=>{options.traceHover=null;paintTraceInfo();});
$('arena').addEventListener('pointermove',event=>{if(drag){event.preventDefault();pointerAim(event);return;}if(options.showTraces&&!modalType&&!menu){options.traceHover=renderer.traceAt(ownTraces(),event.clientX,event.clientY)?.id||null;paintTraceInfo();}});
for(const kind of ['pointerup','pointercancel','lostpointercapture'])$('arena').addEventListener(kind,event=>{if(drag?.id===event.pointerId)endDrag();});
root.addEventListener('blur',endDrag);
document.addEventListener('keydown',event=>{audio.unlock();
 if(modalType){
  if(modalType==='defense'&&!event.ctrlKey&&!event.metaKey&&!event.altKey){
   if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();setDodge(dodge+(event.key==='ArrowLeft'?-.1:.1));return;}
   if(event.key===' '){event.preventDefault();if(!event.repeat)apply({type:'dodge',actor:0,distance:dodge});return;}
   if(event.key==='Escape'){event.preventDefault();goMenu();return;}
  }
  if(event.key==='Escape'){event.preventDefault();if(modalType==='feedback')return;if(modalType==='tutorial'){finishGuide();return;}if(modalType==='defense-offer'){goMenu();return;}if(modalType==='end')goMenu();else {if(modalType==='bonus-defense')game.state.defenseBonus.offerAccepted=false;closeModal();}}
  if(event.repeat&&['Enter',' '].includes(event.key))event.preventDefault();
  if(event.key==='Tab'){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input,select,summary,a[href]')].filter(e=>!e.hidden);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}}
  return;
 }
 const active=document.activeElement;
 if(event.key===' '&&active?.tagName==='BUTTON')return;
 if(menu||event.ctrlKey||event.metaKey||event.altKey||active?.isContentEditable||['SELECT','TEXTAREA','SUMMARY'].includes(active?.tagName)||active?.tagName==='INPUT'&&active.type!=='range')return;
 if(event.key==='Escape'&&settingsOpen){event.preventDefault();settingsOpen=false;render();return;}
 if(event.key==='Escape'&&(options.tracePinned||options.traceHover)){event.preventDefault();options.tracePinned=null;options.traceHover=null;paintTraceInfo();return;}
 const key=event.key,s=game.state,attack=s.phase===F.PREP&&s.active===0,defense=s.phase===F.DEFEND&&game.defender?.id===0;
 if(attack&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)){
  event.preventDefault();if(key==='ArrowLeft'||key==='ArrowRight')changeAngle(key==='ArrowLeft'?-1:1);else changeForce(key==='ArrowUp'?1:-1);
 }else if(defense&&['ArrowLeft','ArrowRight'].includes(key)){event.preventDefault();setDodge(dodge+(key==='ArrowLeft'?-.1:.1));}
 else if(key===' '&&(attack||defense)){event.preventDefault();if(event.repeat)return;if(attack)requestFire();else if(defense)apply({type:'dodge',actor:0,distance:dodge});}
});
root.addEventListener('beforeunload',()=>{persist();J.SCORM?.flush();});
root.addEventListener('pagehide',event=>{persist();if(event.persisted)J.SCORM?.flush();else J.SCORM?.finish();});
root.addEventListener('tank-scorm-status',scormStatus);
let hiddenAt=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){endDrag();hiddenAt=performance.now();clearTimeout(timer);audio.pause();persist();J.SCORM?.flush();}else if(hiddenAt!==null){const shift=performance.now()-hiddenAt;phaseStart+=shift;if(modalType)pausedAt+=shift;hiddenAt=null;noticeClock=performance.now();audio.unlock();drive();}});
function frame(now){
 const dt=Math.max(0,now-noticeClock);noticeClock=now;if(!menu&&!modalType&&!document.hidden){notices.forEach(n=>n.remaining-=dt);notices=notices.filter(n=>n.remaining>0);paintNotices();}
 const clock=modalType?pausedAt:(hiddenAt??now),elapsed=Math.max(0,(clock-phaseStart)/1000),s=game.state;
 if(modalType==='tutorial')J.Tutorial.draw($('guideDemo'),store.data.guide.pending?.step||0,now,options.reduced);
 renderer.draw(game,{time:clock/1000,elapsed,menu,dodge,options,notice:!modalType&&notices.length>0,paused:!!modalType&&modalType!=='defense'||document.hidden});positionAim();
 let loop=null;
 if(!menu&&!modalType&&!document.hidden){
  if(s.phase===F.MOVE){if(s.move.plans.some(p=>P.moveSample(p,elapsed*C.animationSpeed).kind==='drive'))loop='motor';
   (s.move.falls||[]).forEach((f,i)=>{if(f.height>.3&&elapsed*C.animationSpeed>=f.start+f.duration)cue('land','move-land-'+i);});}
  if(s.phase===F.RESULT)(s.result?.falls||[]).forEach((f,i)=>{if(f.height>.3&&elapsed*C.animationSpeed>=Math.sqrt(2*f.height/C.g))cue('land','impact-land-'+i);});
  if(s.phase===F.FLIGHT){const prep=J.attackTiming(s.locked,s.flight).prep,who=s.tanks[s.locked.attackerId].name,rock=s.locked.weapon==='rock';
   const message=who+(elapsed<prep?(rock?' — LETALO PRIHAJA …':' pripravljen na strel …'):(rock?' — TOVOR PADA!':' — STREL!'));
   if($('stageMessage').textContent!==message)$('stageMessage').textContent=message;
   if(rock&&elapsed<prep)loop='motor';
   if(elapsed>=prep){if(!rock)cue('cannon','fire');loop=rock?'rockAir':'shellAir';}
  }
 }
 audio.loop(loop);root.requestAnimationFrame(frame);
}
J.App={get game(){return game;},get store(){return store;},renderer,audio,start,render,apply,loadBankFile,get menu(){return menu;},get modalType(){return modalType;}};
if(J.SCORM){
 const bankButton=document.querySelector('[data-action="load-questions"]');if(bankButton)bankButton.hidden=true;
 document.querySelectorAll('[data-action="setup"]').forEach(b=>b.disabled=!J.SCORM.connected);
 if(!J.SCORM.data)store.data.playerName=J.SCORM.studentName||'Igralec';
}
render();root.requestAnimationFrame(frame);if(store.error)toast(store.error);
J.App.ready=J.Bank.ready?Promise.resolve(J.QuestionBank.length):J.Bank.load().then(count=>{bankStatus('Vprašanja: '+count);return count;}).catch(e=>{J.Bank.error=root.location?.protocol==='file:'?'Izberi datoteko fizikavprasanja9.csv.':e.message==='Failed to fetch'?'Vprašanj ni mogoče naložiti. Izberi CSV.':e.message;bankStatus(J.Bank.error);return 0;});
if(J.Bank.ready)bankStatus('Vprašanja: '+J.QuestionBank.length);
})(globalThis);
